<style>
:root{--bg:#f3f3f5;--card:#ffffff;--ink:#17171c;--mute:#6f6f78;--line:#e7e7ec;--red:#e00800;--on:#fff;--ok:#1b7a49;--okb:#e3f3ea;--warn:#a85f00;--warnb:#fdf0dc;--bad:#b3261e;--badb:#fbe5e3;--info:#2a5d9f;--infob:#e5eefa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0605;--card:#1c0f0d;--ink:#f6efec;--mute:#b0a19c;--line:#3b2521;--red:#ff5148;--ok:#5fcf93;--okb:#16301f;--warn:#f0b35a;--warnb:#3a2a10;--bad:#ff8a82;--badb:#3b1715;--info:#8db8f0;--infob:#162536}}
:root[data-theme="dark"]{--bg:#0f0605;--card:#1c0f0d;--ink:#f6efec;--mute:#b0a19c;--line:#3b2521;--red:#ff5148;--ok:#5fcf93;--okb:#16301f;--warn:#f0b35a;--warnb:#3a2a10;--bad:#ff8a82;--badb:#3b1715;--info:#8db8f0;--infob:#162536}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 340px at 50% -120px,color-mix(in srgb,var(--red) 16%,transparent),transparent 70%) no-repeat,var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,Arial,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 16px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#8f0600,#e00800 60%,#ff4a3d);box-shadow:0 12px 28px -14px rgba(224,8,0,.6)}
.logo{display:flex;align-items:center}.logo img{height:22px;width:auto;display:block}.sheet .logo{background:#e00800;border-radius:8px;padding:7px 12px}
.hello{flex:1;line-height:1.3;color:#fff}.hello b{display:block;font-size:17px}.hello small{color:rgba(255,255,255,.82)}
.badge{font-size:12px;background:rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:99px}
h2{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}h2::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--red)}
.hero{padding:22px 4px 8px;text-align:center}
.clock{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.date{color:var(--mute);margin-bottom:16px}
.punch{width:150px;height:150px;border-radius:50%;border:0;background:var(--red);color:var(--on);font:700 18px inherit;font-family:inherit;cursor:pointer;box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 16%,transparent)}
.punch.out{background:var(--ink);color:var(--bg);box-shadow:0 0 0 8px color-mix(in srgb,var(--ink) 12%,transparent)}
.punch.done{background:var(--okb);color:var(--ok);box-shadow:none;cursor:default}
.punchinfo{margin-top:16px;color:var(--mute);font-size:14px}
.row{display:flex;gap:12px}
.stat{flex:1;padding:14px 0;border-top:2px solid color-mix(in srgb,var(--red) 35%,var(--line))}
.stat b{font-size:26px}.stat span{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--red);color:var(--on);font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(80,12,6,.06)}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;line-height:1.35}.item .t small{display:block;color:var(--mute)}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-info{background:var(--infob);color:var(--info)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 16px;margin-bottom:6px}
.form .btn{margin-top:16px}
nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:130px;background:none;border:0;color:var(--mute);font:500 12px inherit;font-family:inherit;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--red);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.letter{white-space:pre-line;line-height:1.8;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.empty{padding:22px;text-align:center;color:var(--mute)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:14px 0 4px}.seg button{flex:1;border:0;background:none;color:var(--mute);font:500 14px inherit;font-family:inherit;padding:8px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);font-weight:700}.note{color:var(--mute);font-size:13px}
.act{display:flex;gap:6px}.act button{border:0;cursor:pointer;font:inherit;font-size:13px;padding:6px 12px;border-radius:99px}
html{-webkit-text-size-adjust:100%}
body{font-size:clamp(15px,.3vw + 13.8px,17px)}
@media (max-width:380px){.wrap{padding:12px 12px 104px}.clock{font-size:36px}.punch{width:128px;height:128px;font-size:16px}.stat b{font-size:22px}nav button{font-size:11px}}
@media (min-width:700px){.wrap{max-width:760px;padding:24px 24px 120px}.clock{font-size:52px}.stat b{font-size:30px}h2{font-size:19px}#modal{align-items:center}.sheet{border-radius:18px}}
@media (min-width:960px){nav{inset:0 auto 0 0;width:230px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px}nav button{flex:none;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;border-radius:10px}nav button.on{background:color-mix(in srgb,var(--red) 10%,transparent)}.wrap{margin:0 0 0 230px;max-width:none;padding:28px clamp(24px,4vw,64px) 48px}.wrap>*{max-width:880px;margin-left:auto;margin-right:auto}#toast{bottom:28px;left:calc(50% + 115px)}}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}.btn.ghost:hover{background:var(--line)}nav button:hover{color:var(--ink)}.item:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}}
@media (max-height:480px) and (orientation:landscape) and (max-width:959px){.wrap{padding-bottom:70px}nav button{flex-direction:row;gap:6px;padding:4px 0}nav svg{width:20px;height:20px}.hero{padding-top:8px}.punch{width:110px;height:110px}.clock{font-size:34px}}
.feat{border-radius:16px;padding:20px;color:#fff;background:linear-gradient(135deg,#8f0600,#e00800 60%,#ff5b4d);display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.feat small{opacity:.85;text-transform:uppercase;letter-spacing:.08em}.feat b{font-size:22px}.feat span{opacity:.92;font-size:14px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font:inherit;cursor:pointer}.tool i{flex:none;width:36px;height:36px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}.tool span{line-height:1.25;font-size:14px}.tool small{display:block;color:var(--mute);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
@media (min-width:700px){.tools{grid-template-columns:repeat(3,1fr)}}
#splash{position:fixed;inset:0;z-index:100;background:#f21c00;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .lk{width:min(270px,64vw)}
#splash img{display:block;width:100%;height:auto}
#s2{animation:wd .9s cubic-bezier(.2,.8,.2,1) both}
#s1{animation:sw .8s .7s cubic-bezier(.2,.8,.2,1) both}
#s3{animation:cx 1s 1.5s steps(14,end) both}
@keyframes wd{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:none}}
@keyframes sw{from{opacity:0;transform:translateY(-26px) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes cx{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}#splash{transition:none}}
/* Etisalat app style: grey canvas, white rounded cards, pill bars, floating nav */

.ti{width:100%;height:72px;border-radius:22px;display:grid;place-items:center}.ti svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.c1{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red)}

function countDays(a,b){let n=0;for(let d=new Date(a+'T00:00');d<=new Date(b+'T00:00');d.setDate(d.getDate()+1)){const w=d.getDay();if(w!==5&&w!==6)n++}return n}

function month(){const rows=[];for(let d=now.getDate();d>=1;d--){const dt=new Date(Y,M,d),w=dt.getDay();if(w===5||w===6)continue;const k=ymd(dt);let r={k,dt};

const b3=(fn,ic,n,c)=>`<button class="big3 ${c}" onclick="${fn}"><svg viewBox="0 0 24 24">${ICON[ic]}</svg><b>${n}</b></button>`;
return `<section class="card prof"><span class="av big">${ini}</span><div><b>${emp.name}</b><small>ID ${emp.id} \u00b7 ${emp.job}</small></div></section><div class="three">${b3("go('att')",'att','Attendance','c1')}${b3("go('leave')",'leave','Leave','c2')}${b3("go('letters')",'letters','Letters','c3')}</div><section class="card"><h3>Other services</h3>${row("go('it')",'tk','Support')}${row("openTool(4)",'ap','Speak up')}${row("openTool(5)",'tl','Referral form')}${row('toggleTheme()','more','Appearance: light or dark')}</section><p class="note" style="text-align:center">Etisalat CX Solutions \u00b7 demo version</p>`}

function chrome(){const h=['home','tl','od','sd','mo','hd','id','ac'].includes(S.tab),q=document.querySelector('.hi'),t=document.getElementById('tt');q.style.display=h?'':'none';t.style.display=h?'none':'';t.textContent=TITLES[S.tab]||(([...TLTABS(),...OMTABS(),...SMTABS(),...AMTABS(),...HRTABS(),...ITTABS(),...ADTABS()].find(x=>x[0]===S.tab)||[])[1]||'').replace(/ \(\d+\)$/,'')}

{r:'emp',p:'Agent',job:'Call Center Advisor',g:'G2',lo:3500,hi:4800,car:.75,cola:.4,extra:[],ot:'Eligible, paid per hour',kpi:.4,vr:'Commission by collection bucket, EGP 200 to 5,500',vx:1400,rep:'Team Leader',mob:150,tax:.118},
{r:'emp',p:'Senior Agent',job:'Senior Call Center Advisor',g:'G3',lo:4800,hi:6200,car:.75,cola:.4,extra:[['Mentoring allowance',500]],ot:'Eligible, paid per hour',kpi:.4,vr:'Commission by collection bucket, EGP 200 to 5,500',vx:2500,rep:'Team Leader',mob:150,tax:.12},
{r:'tl',p:'Team Leader',job:'Collections Team Leader',g:'G4',lo:7000,hi:9500,car:.8,cola:.4,extra:[],ot:'Not eligible',kpi:.5,vr:'Team achievement bonus, up to EGP 6,000 by team pace',vx:3000,rep:'Operations Manager',mob:0,tax:.14},
{r:'om',p:'Operations Manager',job:'Operations Manager',g:'G6',lo:14000,hi:19000,car:6000,cola:.4,extra:[],ot:'Not eligible',kpi:.5,vr:'Portfolio bonus, up to 25% of basic by pace',vx:4000,rep:'Senior Manager',mob:0,tax:.18},
{r:'am',p:'Account Manager',job:'Client Account Manager',g:'G6',lo:13000,hi:18000,car:6000,cola:.4,extra:[],ot:'Not eligible',kpi:.5,vr:'Account performance bonus, up to 25% of basic by client SLA',vx:3500,rep:'Senior Manager',mob:0,tax:.17},
{r:'sm',p:'Senior Manager',job:'Senior Operations Manager',g:'G7',lo:24000,hi:32000,car:9000,cola:.4,extra:[],ot:'Not eligible',kpi:.5,vr:'Annual bonus, up to 2 times monthly basic',vx:5000,rep:'Director',mob:0,tax:.22},
{r:'hr',p:'HR Specialist',job:'HR Specialist',g:'G3',lo:6000,hi:8500,car:.7,cola:.4,extra:[],ot:'Not eligible',kpi:.3,vr:'No commission, KPI variable only',vx:0,rep:'HR Manager',mob:0,tax:.13},
{r:'it',p:'IT Support Engineer',job:'IT Support Engineer',g:'G4',lo:7500,hi:10500,car:.7,cola:.4,extra:[['On-call allowance',800]],ot:'Eligible for on-call work',kpi:.3,vr:'No commission, KPI variable only',vx:0,rep:'IT Manager',mob:0,tax:.14}];
function ssBody(){const all=S.role==='hr'||S.role==='ad',list=all?SCH:SCH.filter(x=>x.r===S.role),cur=list.find(x=>x.p===S.ps)||list[0],b=Math.round((cur.lo+cur.hi)/2),car=cur.car<=1?b*cur.car:cur.car,cola=b*cur.cola,ex=cur.extra.reduce((a,e)=>a+e[1],0),kv=b*cur.kpi*.85,gross=b+car+cola+ex+kv+cur.vx,si=Math.min(b*.11,1500),tax=(gross-si)*cur.tax,mf=gross*.0005,net=gross-si-tax-cur.mob-mf;
return (list.length>1?`<div class="chips" style="margin-top:12px">${list.map(x=>`<button class="${x.p===cur.p?'on':''}" onclick="S.ps='${x.p}';draw()">${x.p}</button>`).join('')}</div>`:'')+
`<section class="status" style="margin-top:12px"><div class="sh"><b>${cur.p}</b><span class="chip c-info">${cur.g}</span></div><div class="two"><div><b class="n">${n0(cur.lo)} \u2013 ${n0(cur.hi)}</b><small>EGP basic range per month</small></div><div><b class="n r">${cur.rep}</b><small>Reports to</small></div></div></section>
<h2>Fixed pay</h2><div class="list">${rr('Basic salary','EGP '+n0(cur.lo)+' \u2013 '+n0(cur.hi))}${rr('Car allowance',cur.car<=1?Math.round(cur.car*100)+'% of basic':'EGP '+n0(cur.car))}${rr('Cost of living (COLA)',Math.round(cur.cola*100)+'% of basic')}${cur.extra.map(e=>rr(e[0],'EGP '+n0(e[1]))).join('')}${rr('Overtime',cur.ot)}</div>
<h2>Variable pay</h2><div class="list">${rr('KPI variable',Math.round(cur.kpi*100)+'% of basic \u00d7 KPI score')}${rr('Performance pay',cur.vr)}</div>
<h2>Deductions</h2><div class="list">${rr('Social insurance (employee)','11% of basic, up to EGP 1,500')}${rr('Income tax','about '+(cur.tax*100).toFixed(1)+'% (estimate)')}${rr('Mobile phone',cur.mob?'EGP '+n0(cur.mob):'None')}${rr('Martyrs fund','0.05% of total payment')}</div>
<h2>Example month</h2><div class="row"><div class="stat"><span>Total payment</span><br><b>${egp(gross)}</b><br><span>\u2248 ${aed(gross)}</span></div><div class="stat"><span>Net pay</span><br><b style="color:var(--red)">${egp(net)}</b><br><span>\u2248 ${aed(net)}</span></div></div><div class="list" style="margin-top:12px">${rr('Basic (mid range)',egp2(b))}${rr('Car allowance',egp2(car))}${rr('COLA',egp2(cola))}${cur.extra.map(e=>rr(e[0],egp2(e[1]))).join('')}${rr('KPI variable at 85%',egp2(kv))}${rr('Performance pay',egp2(cur.vx))}${rr('Total payment',egp2(gross),1)}${rr('Social insurance','-'+egp2(si))}${rr('Income tax (estimate)','-'+egp2(tax))}${rr('Mobile phone','-'+egp2(cur.mob))}${rr('Martyrs fund','-'+egp2(mf))}${rr('Net pay',egp2(net),1)}</div>`+
(all?`<h2>All positions</h2><div class="list">${SCH.map(x=>`<div class="item"><div class="t">${x.p}<small>${x.g} \u00b7 reports to ${x.rep}</small></div><b>${n0(x.lo)}\u2013${n0(x.hi)}</b></div>`).join('')}</div>`:'')+
`<p class="note">Demo figures only. The real pay structure is set by HR and payroll.</p>`}
